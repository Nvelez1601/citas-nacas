<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking Confirmed</title>
    <style>
      body {
        background: #f9e5e8;
        font-family: "Georgia", serif;
        color: #2f1b1b;
        padding: 24px;
      }
      .card {
        background: #ffffff;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 12px 30px rgba(47, 27, 27, 0.12);
      }
      .title {
        font-size: 24px;
        margin-bottom: 8px;
      }
      .label {
        font-weight: bold;
        text-transform: uppercase;
        font-size: 12px;
        letter-spacing: 1px;
      }
      .content {
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title">Your booking is confirmed</div>
      <div class="content">
        <div class="label">Date</div>
        <div>{{ date }}</div>
      </div>
      <div class="content">
        <div class="label">Experience</div>
        <div>{{ name }}</div>
      </div>
      <div class="content">
        <div class="label">Challenge</div>
        <div>{{ challenge }}</div>
      </div>
      <div class="content">
        <div class="label">Comments</div>
        <div>{{ comments }}</div>
      </div>
    </div>
  </body>
</html>
