<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking Confirmed</title>
    <style>
      body {
        background: #fadadd;
        background: radial-gradient(circle at top, #fde9ee 0%, #fadadd 45%, #fbeef1 100%);
        font-family: "Georgia", serif;
        color: #2f1b1b;
        padding: 24px;
      }
      .card {
        background: #ffffff;
        border-radius: 20px;
        padding: 28px;
        box-shadow: 0 18px 40px rgba(47, 27, 27, 0.12);
        border: 1px solid #f2c5d1;
      }
      .title {
        font-size: 26px;
        margin-bottom: 12px;
      }
      .label {
        font-weight: bold;
        text-transform: uppercase;
        font-size: 12px;
        letter-spacing: 2px;
        color: #c66e84;
      }
      .content {
        margin-bottom: 16px;
      }
      .accent {
        color: #f38ba7;
      }
      .chip {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 999px;
        background: #fde9ee;
        border: 1px solid #f2c5d1;
        color: #c66e84;
        font-size: 12px;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title">Your booking is confirmed</div>
      <div class="content">
        <div class="label">Date</div>
        <div>{{ date }}</div>
      </div>
      <div class="content">
        <div class="label">Dress code</div>
        <div class="chip">{{ dress_code }}</div>
      </div>
      <div class="content">
        <div class="label">Experience</div>
        <div>{{ name }}</div>
      </div>
      <div class="content">
        <div class="label">Challenge</div>
        <div>{{ challenge }}</div>
      </div>
      <div class="content">
        <div class="label">Comments</div>
        <div>{{ comments }}</div>
      </div>
    </div>
  </body>
</html>
